name: Backend Pipeline - Airline Management System

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest 

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "testpassword"
          MYSQL_DATABASE: "testdb"
        ports:
          - 3308:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Clone
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.4' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Check imports (isort)
      run: isort --check-only .

    - name: Check format (black)
      run: black --check .

    - name: Create database tables
      run: |
        mysql -h 127.0.0.1 -P 3308 -u root -ptestpassword testdb < sql/init.sql

    - name: Testing (pytest)
      run: pytest -v
      env:
        TESTING: "True"
        DB_HOST: "127.0.0.1"
        DB_USER: "root"
        DB_TEST_PASS: "testpassword"
        DB_TEST_NAME: "testdb"
        DB_TEST_PORT: "3308"