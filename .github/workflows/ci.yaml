name: Backend Pipeline - Airline Management System

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest 

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.DB_TEST_NAME }}
          MYSQL_DATABASE: ${{ secrets.DB_TEST_PASS }}
        ports:
          - 3308:3306

    steps:
    - name: Clone
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.4' 

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ".[dev]"

    - name: Check imports (isort)
      run: isort --check-only .

    - name: Check format (black)
      run: black --check .

    - name: Testing (pytest)
      run: pytest -v
      env:
        TESTING: "True"
        DB_HOST: "127.0.0.1"
        DB_USER: "root"
        DB_TEST_PASS: ${{ secrets.DB_TEST_PASS }} 
        DB_TEST_NAME: ${{ secrets.DB_TEST_NAME }}
        DB_TEST_PORT: "3308"